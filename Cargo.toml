[package]
name = "ps5emu"
version = "0.3.0"
edition = "2021"
description = "Experimental PS5 emulator skeleton with a console-style launcher (work in progress)"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
eframe = { version = "=0.29.1", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

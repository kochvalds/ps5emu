name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Тесты: с окном и без него
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Системные библиотеки
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev
      - run: cargo test
      - run: cargo test --no-default-features

  # 2. Сборка под три платформы. Падение одной не отменяет остальные.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux,   os: ubuntu-22.04 }   # старый glibc: AppImage запустится на большем числе дистрибутивов
          - { name: windows, os: windows-latest }
          - { name: macos,   os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Системные библиотеки (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libfuse2

      - name: Сборка release
        run: cargo build --release

      - name: Упаковка AppImage
        if: runner.os == 'Linux'
        run: bash packaging/build-appimage.sh

      - name: Упаковка zip
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/ps5emu.exe -DestinationPath ps5emu-windows-x86_64.zip

      - name: Упаковка tar.gz
        if: runner.os == 'macOS'
        run: tar -czf "ps5emu-macos-$(uname -m).tar.gz" -C target/release ps5emu

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            ps5emu-x86_64.AppImage
            ps5emu-windows-x86_64.zip
            ps5emu-macos-*.tar.gz
          if-no-files-found: error

  # 3. Релиз: только для push/ручного запуска, публикует всё, что собралось
  release:
    needs: [test, build]
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Контрольные суммы
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Каждый push в main или ручной запуск: релиз "latest" пересоздаётся
      - name: Обновить релиз latest
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Автоматическая сборка из коммита ${GITHUB_SHA::7}."
            echo
            echo "**Последние изменения**"
            git log -10 --pretty='- %s (%h)'
            echo
            echo "**Как запустить**"
            echo "- Linux: \`chmod +x ps5emu-x86_64.AppImage && ./ps5emu-x86_64.AppImage\`"
            echo "- Windows: распакуйте zip и запустите \`ps5emu.exe\`"
            echo "- macOS: \`tar -xzf ps5emu-macos-*.tar.gz && xattr -d com.apple.quarantine ps5emu; ./ps5emu\` (бинарник не подписан)"
          } > notes.md
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* \
            --target "$GITHUB_SHA" \
            --title "ps5emu — последняя сборка" \
            --notes-file notes.md \
            --prerelease

      # Тег v*: отдельный версионный релиз
      - name: Версионный релиз
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "ps5emu $GITHUB_REF_NAME" \
            --generate-notes
